<template>
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading..." size="medium">
        </lightning-spinner> 
    </template>
    <template if:false={isLoading}>
        <div class={dynamicClass}>      
            <template if:false={sendButtonClicked}>
                <main class="help-main">
                    <div class="message-gif-div">
                        <img src={messageGif} />
                    </div>
                    <div class="help-text">
                        How Can We Help You?
                    </div>
                    <div class="seaches-main-div">
                        <div class="popular-text">
                            Most Popular Searches
                        </div>
                        <div class="seaches-div">                           
                            <template if:true={prompts}>
                                <template for:each={prompts} for:item="prompt">
                                    <div class="prompt-div" key={prompt.Id} data-id={prompt.Frequent_Prompts__c} onclick={handleSend}>
                                        <div class="prompt-text">
                                            {prompt.Frequent_Prompts__c}
                                        </div>
                                        <img class='img-icon' src={chevronRight} />
                                    </div>
                                </template>
                            </template>
                        </div>
                    </div>
                </main>
            </template>
            <template if:true={sendButtonClicked}>
                <div class="bg">
                    <c-chat-messages class="msgs-box-chat-message" button-text={buttonText} onscrollupdate={handleScrollToBottom}></c-chat-messages>
                </div>    
            </template>
            <c-chat-input class="txt-box" onvaluechange={checkPromptEntered} onupdatevisibility={handleHistoryVisibility} onreportvisibility={handleReportVisibility} onnewchatclick={handleNewChat}></c-chat-input>
        </div>
        <template if:true={showHistory}>
            <c-chat-history class="chat-history-how-can-help" onbackbuttonclick={handleHistoryBackClick} ondatafromchathistory={handleChatHistorySelected}></c-chat-history>
        </template>
        <template if:true={showReport}>
            <c-saved-reports class="chat-history-how-can-help" onbackbuttonclick={handleReportBackClick}></c-saved-reports>
        </template>
    </template>
</template>
