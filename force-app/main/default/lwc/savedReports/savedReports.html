<template>
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading..." size="medium">
        </lightning-spinner> 
    </template>
    <template if:false={isLoading}>
        <div class="report-main">
            <div class="header">
                <div class="back-icon" onclick={handleBackButton}>
                    <img src={chevronleftIcon} />
                </div>
                <span class="title">Saved Reports</span>
            </div>
            <div class="search-container">
                <lightning-input type="search" placeholder="Search..." class="search-input" onchange={handleSearch}></lightning-input>
            </div>
            <div class="chat-list">
                <template if:true={hasReport}>
                    <template for:each={filteredReportList} for:item="chat">
                        <div key={chat.threadId} class="chat-item">
                            <p class="chat-content">{chat.label}</p>
                            <div class="date-div">
                                <a href="javascript:void(0)" class="chat-link" data-threadid={chat.threadId} onclick={handleViewChat}>Run</a>
                                <p class="chat-time">{chat.formattedTimestamp}</p>
                            </div>
                        </div>
                    </template>
                </template>
                <template if:false={hasReport}>
                    <p class="no-report-text">There is no Saved Report yet.</p>
                </template>
            </div>
        </div>
    </template>
</template>
